name: CI

# Build the three MCU firmwares from the pinned Klipper + patches, install the whole host
# stack on a clean Ubuntu runner, and check that Klipper accepts the configuration against
# the firmware dictionaries and that Moonraker starts cleanly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: shellcheck
        run: shellcheck -x -S warning install.sh scripts/*.sh printer/q2-printer.sh config/plr/*.sh tests/*/*.sh
      - name: python
        run: python3 -m py_compile scripts/*.py
      - name: macros
        run: sudo apt-get install -y -qq python3-jinja2 >/dev/null && for t in tests/macros/test_*.py; do python3 "$t" || exit 1; done
      - name: failure detection
        run: |
          sudo apt-get install -y -qq python3-aiohttp python3-pil >/dev/null
          python3 -m py_compile detect/q2_detect/*.py tests/detect/*.py
          for t in tests/detect/test_*.py; do python3 "$t" || exit 1; done
      - name: pages
        run: node --test tests/web/*.test.mjs

  detect:
    # The q2-detect service with Obico's ML API image pinned in VERSIONS, as the installer
    # pulls it, against a fake Moonraker and camera
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Pull the ML API and run end to end
        run: tests/detect/ci.sh

  ml-api-intel:
    # q2-offload's Intel GPU build of Obico's ML API (detect/ml-api/Containerfile.intel): built
    # from the pinned obico-server commit, run end to end on OpenVINO's CPU device (runners have
    # no Intel GPU), and published outside pull requests unless that tag already exists
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Image tag
        id: image
        run: |
          . scripts/lib.sh
          image="$(obico_ml_api_intel_image)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        if: steps.image.outputs.published != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: scripts/build-ml-api-intel.sh "$IMAGE"
      - name: End to end on OpenVINO's CPU device
        if: steps.image.outputs.published != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          ML_API_ARGS: -e OV_DEVICE=CPU
        run: tests/detect/ci.sh "$IMAGE"
      - name: Publish
        if: steps.image.outputs.published != 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push -q "$IMAGE"

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Klipper + Q2 patches
        run: scripts/prepare-klipper.sh "$RUNNER_TEMP/klipper"
      - name: Build main / thr / box
        run: scripts/build-firmware.sh "$RUNNER_TEMP/klipper" dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  flash-sim:
    # The printer-side flash logic against fake devices: first conversion, resumed
    # conversion (deployers must be skipped), and a swapped image (must be refused)
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Simulated flash
        run: |
          # Both registries rate-limit anonymous pulls from shared runners: retry, alternating
          img=""
          for i in 1 2 3 4 5 6; do
            for c in public.ecr.aws/docker/library/debian:bookworm debian:bookworm; do
              docker pull -q "$c" >/dev/null 2>&1 && { img="$c"; break 2; }
            done
            sleep $((i * 15))
          done
          [ -n "$img" ] || { echo "could not pull debian:bookworm"; exit 1; }
          docker run --rm -v "$PWD:/repo:ro" "$img" bash /repo/tests/flash-sim/run.sh /repo /repo/dist

  host:
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Install the host stack (CI mode)
        run: ./install.sh host --ci --yes
      - name: Validate Klipper and Moonraker configuration
        run: scripts/validate-config.sh dist
      - name: Re-run the installer (update path must be idempotent)
        run: ./install.sh host --ci --yes && scripts/validate-config.sh dist
      - name: Unattended update, user phase (what Moonraker triggers)
        run: ./install.sh _update-user --unattended --ci && scripts/validate-config.sh dist
      - name: Logs
        if: failure()
        run: |
          tail -100 ~/.config/q2-offload/happy-hare-install.log || true
          ls -la ~/printer_data/config ~/printer_data/config/mmu/base || true

  tag:
    # Every version of main that passes goes to the "latest" update channel (beta tag).
    # The daily upstream update tags its own commits (bump.yml).
    needs: [lint, host, flash-sim, detect, ml-api-intel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Beta tag
        run: scripts/tag-release.sh beta "$GITHUB_SHA"
