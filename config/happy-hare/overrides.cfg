# q2-offload settings applied on top of the config that the Happy Hare installer generates
# from mmu_config (Qidi Box + Qidi Q2 toolhead). scripts/apply-overrides.py re-applies them
# after every Happy Hare install/upgrade, so Happy Hare can keep migrating its own files.
#
# Section headers are "[<file under mmu/base> :: <klipper section>]".
#   key: value   set (or add) the option
#   !key         remove the option
#   !section     (alone in a section) remove the whole section

[mmu.cfg :: mmu_parameters]
log_file_level: 2
log_m117_messages: 1
# Q2 extruder: slower filament moves through the toolhead are more reliable
extruder_load_speed: 4
extruder_unload_speed: 6
extruder_sync_load_speed: 4
extruder_sync_unload_speed: 6
extruder_homing_speed: 6
form_tip_macro: _MMU_SMART_TIP
slicer_tip_park_pos: 0
# BUCKET_PURGE (gcode_macro_mmu.cfg): purge into the Q2 chute bucket
purge_macro: BUCKET_PURGE
endless_spool_on_load: 1
# NFC tags create the spool in Spoolman on first scan (see docs/spoolman-nfc.md)
spoolman_nfc_auto_create: 1
startup_reset_ttg_map: 0
show_error_dialog: 0
filament_recovery_on_pause: 0
retry_tool_change_on_error: 1
update_trsync: 1
canbus_comms_retries: 3

# Drying temperature/time per material (MMU_HEATER DRY=1, MMU_KEEP_DRY). Same materials as
# the print-time table in mmu_keep_dry.cfg (_BOX_PRINT_HEAT print_temps); Happy Hare dries at
# the lowest temperature of the loaded gates and caps it at heater_max_temp.
drying_data: {
    'PLA': (45, 300), 'PLA+': (55, 300), 'PLA-CF': (45, 300), 'PLA-S': (45, 300),
    'PLA-WOOD': (45, 300), 'PETG': (60, 300), 'PETG-CF': (60, 300), 'PETG-GF': (60, 300),
    'TPU': (55, 300), 'TPEE': (55, 300), 'PEBA': (55, 300), 'ASA': (65, 300),
    'ASA-CF': (65, 300), 'ASA-AERO': (65, 300), 'ABS': (70, 300), 'ABS+': (75, 300),
    'ABS-GF': (70, 300), 'PC': (75, 600), 'PC-ABS': (70, 600), 'PC-ABS-FR': (70, 600),
    'PET-GF': (65, 600), 'PET-CF': (65, 600), 'PVA': (75, 600), 'HIPS': (75, 600),
    'NYLON': (75, 600), 'PA': (75, 600), 'ULTRAPA': (75, 600), 'PA-CF': (75, 600),
    'PA12-CF': (75, 600), 'ULTRAPA-CF25': (75, 600), 'PA-S': (75, 600), 'PAHT-CF': (75, 600),
    'PAHT-GF': (75, 600), 'PAHT-S': (75, 600), 'PPS-CF': (75, 600), 'PPS-GF': (75, 600) }

[mmu.cfg :: mmu_toolhead default]
toolhead_extruder_to_nozzle: 79
toolhead_sensor_to_nozzle: 62

[mmu.cfg :: mmu_led_effect mmu_breathing_white_slow]
define_on: exit, status, gates

[mmu.cfg :: mmu_led_effect mmu_breathing_white_fast]
define_on: exit, status, gates

[mmu_hardware_unit0.cfg :: mcu unit0]
serial: @HOME@/printer_data/comms/q2-mmu

[mmu_hardware_unit0.cfg :: mmu_unit unit0]
# One RC522 reader serves two gates (A: gates 0-1, B: gates 2-3)
nfc_readers: unit0_nfc01, unit0_nfc01, unit0_nfc23, unit0_nfc23

[mmu_hardware_unit0.cfg :: mmu_stepper unit0_gear]
rotation_distance: 13.8
step_pulse_duration: 0.000000100

[mmu_hardware_unit0.cfg :: mmu_stepper unit0_gear_1]
step_pulse_duration: 0.000000100

[mmu_hardware_unit0.cfg :: mmu_stepper unit0_gear_2]
step_pulse_duration: 0.000000100

[mmu_hardware_unit0.cfg :: mmu_stepper unit0_gear_3]
step_pulse_duration: 0.000000100

[mmu_hardware_unit0.cfg :: temperature_sensor unit0_Env]
# Software i2c: errors on hardware i2c3 shut the whole Box MCU down
!i2c_bus
i2c_software_scl_pin: unit0:PA8
i2c_software_sda_pin: unit0:PC9

[mmu_hardware_unit0.cfg :: heater_generic unit0_heater]
# Half power: at full power the elements reach ~100 C while the air is still below 50 C,
# enough to deform PETG spool adapters (stock firmware limits this with a second control
# loop that mainline Klipper does not have). The element thermistors are also watched by
# _BOX_HEATER_GUARD (mmu_keep_dry.cfg).
max_power: 0.5
max_temp: 70
maximum_deviation: 100

# shutdown_speed 0: all three fans starting at 100% on a Klipper shutdown or restart
# browns out the Box USB hub
[mmu_hardware_unit0.cfg :: heater_fan unit0_heater_fan_a]
shutdown_speed: 0

[mmu_hardware_unit0.cfg :: heater_fan unit0_heater_fan_b]
shutdown_speed: 0

[mmu_hardware_unit0.cfg :: controller_fan unit0_board_fan]
shutdown_speed: 0

[mmu_hardware_unit0.cfg :: output_pin unit0_nfc_rst]
shutdown_value: 0

[mmu_hardware_unit0.cfg :: mmu_nfc_reader unit0_nfc01]
spi_bus: spi2
spi_speed: 5000000
rx_gain: 0

[mmu_hardware_unit0.cfg :: mmu_nfc_reader unit0_nfc23]
spi_bus: spi2
spi_speed: 5000000
rx_gain: 0

# Measured on a Box V2 hub (2026-10-09): 16 mm real slider travel from the tension switch,
# 18 mm end to end. The HH profile's 8/12 made the sync feedback over-correct.
[mmu_hardware_unit0.cfg :: mmu_buffer unit0]
buffer_range: 16
buffer_maxrange: 18

[mmu_parameters_unit0.cfg :: mmu_unit_parameters unit0]
nfc_deep_read: 1
nfc_neighbor_check: 1
nfc_field_probe_reads: 3
nfc_gate_jog_scan_window: -480, 60
nfc_preload_jog_scan_window: -480, 60
nfc_neighbor_evict_distance: -100
nfc_gate_clear_distance: -70
nfc_preload_clear_distance: -70
gear_load_speed: 100
gear_load_accel: 300
gear_unload_speed: 100
gear_unload_accel: 50
gear_homing_speed: 80
gear_short_move_accel: 50
gate_preload_endstop: mmu_shared_exit
bowden_homing_max: 2500
bowden_load_homing_buffer: 100
bowden_unload_homing_buffer: 0
extruder_homing_max: 50
toolhead_unload_safety_margin: 30
# Each material has its own temperature (drying_data, _BOX_PRINT_HEAT); 65 C is reached only
# with PA/PAHT/PPS/PET-CF types. Spool adapters printed in PETG soften above ~60 C.
heater_max_temp: 65
skip_cal_rotation_distance: 1

[mmu_macro_vars.cfg :: save_variables]
# printer.cfg keeps a single [save_variables] (saved_variables.cfg) for Qidi and HH macros
!section

[mmu_macro_vars.cfg :: gcode_macro _MMU_SOFTWARE_VARS]
variable_check_gates: True

[mmu_macro_vars.cfg :: gcode_macro _MMU_SEQUENCE_VARS]
variable_enable_park_printing: 'toolchange,runout,load,unload,complete,pause,cancel'
variable_enable_park_standalone: 'toolchange,load,unload,pause,cancel'
variable_park_toolchange: -999, -999, 1, 0, 2
variable_park_runout: -999, -999, 1, 5, 2
variable_park_pause: 50, 50, 5, 0, 2
variable_park_cancel: -999, -999, 10, 0, 5
variable_park_complete: 50, 50, 10, 0, 5
variable_pre_load_position: -999, -999, 0
variable_restore_xy_pos: 'last'
variable_park_travel_speed: 150
# _MMU_PARK_MOVE (gcode_macro_mmu.cfg): leaves the chute in two straight moves, never diagonally
variable_user_park_move_macro: '_MMU_PARK_MOVE'
variable_timelapse: True
variable_user_post_form_tip_extension: 'PURGE_PARK'
# PURGE_PARK: go over the bucket before every load so pushed filament drops into it
variable_user_pre_load_extension: 'PURGE_PARK'
variable_user_post_load_extension: ""

[mmu_macro_vars.cfg :: gcode_macro _MMU_CLIENT_VARS]
variable_user_resume_extension: 'BUCKET_PURGE PURGE_LENGTH=40'

[mmu_macro_vars.cfg :: gcode_macro _MMU_FORM_TIP_VARS]
variable_toolchange_fan_name: 'fan_generic cooling_fan'
variable_final_cooling_speed: 50

[mmu_macro_vars.cfg :: gcode_macro _MMU_PURGE_VARS]
variable_extruder_purge_speed: 2

[mmu_macro_vars.cfg :: gcode_macro _MMU_CUT_TIP_VARS]
# Q2 stock cutter: press the lever twice, gently
variable_retract_length: 10
variable_simple_tip_forming: True
variable_cut_stepper_current: 105
variable_pin_loc_xy: 11, 0.5
variable_pin_park_dist: 11.5
variable_rip_length: 1.0
variable_rip_speed: 3
variable_pushback_length: 3.0
variable_pushback_dwell_time: 0
variable_cut_fast_move_speed: 32
variable_cut_slow_move_speed: 8
variable_cut_dwell_time: 50
variable_cut_fast_move_fraction: 1.0
variable_safe_margin_xy: 60, 60
variable_cut_iterations: 2
