[gcode_macro PRINT_END]
gcode:
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    # M106 P3 S0

    M104 S0
    M140 S0
    M141 S0
    DISABLE_BOX_HEATER

    M220 S100
    M221 S100
    M84

    DISABLE_ALL_SENSOR
#    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    G31
    CLEAR_LAST_FILE
    BEEP I=2 DUR=500
    HELIX_ENDED                     # HelixScreen: print ended
    # No SDCARD_RESET_FILE: PRINT_END is called from the end of the G-code (slicer) and Klipper
    # refuses SDCARD_RESET_FILE from within the file ("cannot be run from the sdcard"), which errors the print.

# ============================================================
# PAUSE / RESUME / CANCEL_PRINT
# ------------------------------------------------------------
# Defined in mmu/optional/client_macros.cfg (Happy Hare).
# Custom park/retract/restore behavior provided here via the
# _CLIENT_VARIABLE hooks below.
# ============================================================

[gcode_macro _CLIENT_VARIABLE]
# Happy Hare's _MMU_PARK handles parking on pause/cancel. Do NOT enable
# use_custom_pos / park_at_cancel here — the two parkers will race and the
# pause will fall through to cancel.
variable_use_custom_pos   : False
variable_custom_park_dz   : 5.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 200.0
variable_park_at_cancel   : False
variable_idle_timeout     : 259200          # 72h while paused
variable_runout_sensor    : ""              # MMU manages runout via its own logic
variable_user_pause_macro : "_USER_PAUSE_EXTRA"
variable_user_resume_macro: "_USER_RESUME_EXTRA"
variable_user_cancel_macro: "_USER_CANCEL_EXTRA"
gcode:

[gcode_macro _USER_PAUSE_EXTRA]
description: Extra actions run after Happy Hare/Klipper PAUSE_BASE
# IMPORTANT: keep this minimal. Happy Hare's _MMU_PARK handles parking,
# retraction, and state save. Do NOT turn off the hotend or disable the
# extruder stepper here — Happy Hare needs them live to manage the MMU
# pause state, and disabling them causes the pause to fail over to cancel.
gcode:
    DISABLE_ALL_SENSOR

[gcode_macro _USER_RESUME_EXTRA]
description: Extra actions run before Happy Hare/Klipper RESUME_BASE
gcode:
    {% if printer.mmu is defined and printer.mmu.enabled %}
        {% if printer.mmu.filament_pos|default(0)|int < 7 %}
            RESPOND TYPE=error MSG="Resume aborted: MMU reports no filament at toolhead. Reload via MMU and press RESUME again."
        {% endif %}
    {% endif %}

[gcode_macro _USER_CANCEL_EXTRA]
description: Extra actions run before Happy Hare/Klipper CANCEL_PRINT_BASE
gcode:
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    M106 P2 S0
    M106 P0 S0
    M106 P3 S0
    M104 S0
    M140 S0
    M141 S0
    DISABLE_BOX_HEATER
    M220 S100
    M221 S100
    M84
    DISABLE_ALL_SENSOR
    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    G31
    BEEP I=2 DUR=500
    CLEAR_LAST_FILE
    HELIX_RESET                     # HelixScreen: print canceled
    M118 Canceled print!



[gcode_macro M141]
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|float %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={([s, 65]|min)}
    {% endif %}


[gcode_macro M191]
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|float %}
    
        M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  
        {% if s != 0 %}
            TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={([s, 65]|min)-2}
        {% endif %}
    {% endif %}
     
[gcode_macro M106]
gcode:
    {% set p = params.P|default(0)|int %}

    {% if p == 2 %}
    {% if params.S is defined %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={(params.S|float / 255.0)}
    {% else %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1
    {% endif %}
    {% endif %} 

    {% if p == 0 %}
    {% if params.S is defined %}
        SET_FAN_SPEED FAN=cooling_fan SPEED={(params.S|float / 255.0)}
        
    {% else %}
        SET_FAN_SPEED FAN=cooling_fan SPEED=1
    {% endif %}
    {% endif %} 

    {% if p == 3 %}
    {% if params.S is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={(params.S|float / 255.0)}
    {% else %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=1
    {% endif %}
    {% endif %} 

    {% if p == 4 %}
        {% if params.S is defined %}
            SET_PIN PIN=Polar_cooler VALUE={1 if (params.S|int / 255) > 0 else 0}
        {% else %}
            SET_PIN PIN=Polar_cooler VALUE=1
        {% endif %}
    {% endif %}

[gcode_macro M107]
gcode:  
    SET_FAN_SPEED FAN=cooling_fan SPEED=0

[gcode_macro M303]
gcode:
    {% if params.E is defined %}
     {% if params.S is defined %}
        {% if (params.E|int)==-1 %} 
         PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
        {% endif %}
        {% if (params.E|int)==0 %}
         PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
        {% endif %}
     {% endif %}
  {% endif %}


[gcode_macro M900]
gcode:
    {% if params.K is defined %} 
          SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}  
    {% if params.T is defined %}    
       SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
    {% endif %} 

[gcode_macro M290]
gcode:
   SET_GCODE_OFFSET Z_ADJUST={params.Z}

[gcode_macro M901]
gcode:
    m104 S0         #turn off nozzle heater for resonance test
    G28
    SHAPER_CALIBRATE
    M118 Input shaper complete
    SAVE_CONFIG
       
[gcode_macro M0]
gcode:
    PAUSE

[gcode_macro M25]
rename_existing: M9925
gcode:
    PAUSE

[gcode_macro M4029]
gcode:
    {% set bedtemp = params.S|default(60)|float %}
    DISABLE_ALL_SENSOR
    M104 S140
    M140 S{bedtemp}
    SAVE_VARIABLE VARIABLE=z_offset VALUE=0
    SET_GCODE_OFFSET Z=0 MOVE=0
    M4031
    G28 
    M400
    M118 Position init complete

    CLEAR_NOZZLE HOTEND=260
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=140
    M118 Nozzle cooled
    Z_TILT_ADJUST
    G28
    G1 z10 F600
    BED_MESH_CALIBRATE
    G0 Z50 F600
    G0 X130 Y130 F9000
    M400
    M118 Bed mesh calibrate complete
    SAVE_CONFIG

 
