[gcode_macro _MMU_FLEX_PROFILE]
description: If a flexible filament (keywords from _MMU_SMART_TIP) is used by a tool, disable sync feedback and tangle prevention for this print; otherwise restore the Happy Hare config values
# For flexible filaments (TPU), sync feedback and tangle prevention are turned off for the
# print because they over-feed flexible filament. Other prints restore the Happy Hare config values.
# Happy Hare config section the values to restore come from
variable_unit_section: 'mmu_unit_parameters unit0'
gcode:
    {% set materials = (params.TOOL_MATERIALS | default('')).upper().split(',') %}
    {% set tools = ((params.REFERENCED_TOOLS | default('')) or (params.INITIAL_TOOL | default(''))).split(',') %}
    {% set flex_keywords = printer['gcode_macro _MMU_SMART_TIP'].flex_keywords %}
    {% set ns = namespace(flex=[]) %}
    {% for t in tools %}
        {% set i = t | trim | int(-1) %}
        {% if i >= 0 and i < materials | length %}
            {% set m = materials[i] | trim %}
            {% if flex_keywords | select('in', m) | list | length > 0 %}
                {% set ns.flex = ns.flex + ['T' ~ i ~ '=' ~ m] %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% set cfg = printer.configfile.settings[unit_section] %}
    {% if ns.flex %}
        {action_respond_info("Flexible (" ~ ns.flex | join(', ') ~ ") -> sync feedback and tangle prevention disabled for this print")}
        MMU_TEST_CONFIG sync_feedback_enabled=0 tangle_prevention_enabled=0
    {% else %}
        MMU_TEST_CONFIG sync_feedback_enabled={cfg.sync_feedback_enabled} tangle_prevention_enabled={cfg.tangle_prevention_enabled}
    {% endif %}

[gcode_macro PRINT_START]
gcode:
    AUTOTUNE_SHAPERS #does nothing?
    DISABLE_ALL_SENSOR #disables the filament runout sensor
    CLEAR_PAUSE
    HELIX_RESET                     # HelixScreen: clean state for this print
    # Adapt the MMU to the material before any load/sync (TOOL_MATERIALS/REFERENCED_TOOLS are sent by the slicer)
    _MMU_FLEX_PROFILE TOOL_MATERIALS="{params.TOOL_MATERIALS}" REFERENCED_TOOLS="{params.REFERENCED_TOOLS}" INITIAL_TOOL="{params.INITIAL_TOOL}"
    # Box heating per material, like stock (mmu_keep_dry.cfg); warms up during homing and bed heating
    _BOX_PRINT_HEAT TOOL_MATERIALS="{params.TOOL_MATERIALS}" REFERENCED_TOOLS="{params.REFERENCED_TOOLS}"

    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}

    M104 S0
    {% if chambertemp == 0 %}
        M106 P3 S255
    {% endif %}
    M140 S{bedtemp}    
    # Always do a REAL home at print start: never trust homed_axes here, a
    # FAKE_HOME_Z or stale session would otherwise let the print run on
    # bogus coordinates (motors grinding into the frame).
    HELIX_PHASE_HOMING
    G28
    M141 S{chambertemp}    
    SET_GCODE_OFFSET Z=0 MOVE=0

    HELIX_PHASE_CLEANING
    NOZZLE_WIPE HOTEND={hotendtemp} # heat, wipe and scrub the nozzle on the brush (no purge)
    #Cutting and leveling
    #CUT_FILAMENT_1 #stupid and pointless
    M104 S150
    G4 P3000
    M400
    # Re-home with a clean nozzle (like the stock Qidi PRINT_START): the load cell Z0 must not include residue
    HELIX_PHASE_HOMING
    G28

    M104 S150
    HELIX_PHASE_HEATING_BED
    M190 S{bedtemp}   
    M191 S{chambertemp}
    M400
    G4 P3000

    # Z tilt while hot, just before the mesh: the bed has already expanded
    HELIX_PHASE_Z_TILT
    Z_TILT_ADJUST

    HELIX_PHASE_BED_MESH
    G90
    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=ADAPTIVE PROBE_COUNT=7,7 
    G0 Z50 F600
    G0 X260 Y5  F30000
    HELIX_PHASE_HEATING_NOZZLE
    M191 S{chambertemp}
    M109 S{hotendtemp}
    M204 S10000
    
    # 3. MMU setup + chargement initial (maintenant safe car homed)
    HELIX_PHASE_PURGING
    MMU_START_SETUP INITIAL_TOOL={params.INITIAL_TOOL} TOTAL_TOOLCHANGES={params.TOTAL_TOOLCHANGES} REFERENCED_TOOLS="{params.REFERENCED_TOOLS}" TOOL_COLORS="{params.TOOL_COLORS}" TOOL_TEMPS="{params.TOOL_TEMPS}" TOOL_MATERIALS="{params.TOOL_MATERIALS}" FILAMENT_NAMES="{params.FILAMENT_NAMES}" PURGE_VOLUMES="{params.PURGE_VOLUMES}"
    MMU_START_CHECK
    MMU_START_LOAD_INITIAL_TOOL         ; Charge le tool initial (peut unload/cut/load)

    set_zoffset
    ENABLE_ALL_SENSOR
    save_last_file
    HELIX_READY                     # HelixScreen: preparation done, print starts

[gcode_macro NOZZLE_WIPE]
description: Nozzle clean-up modelled on the stock Qidi Q2 CLEAR_NOZZLE, without purge (the MMU purges after loading): heat over the chute, cool down, wipe on the chute, scrub in circles on the brush, then wipe deeper
# Positions, depths and temperatures taken from the stock Qidi Q2 CLEAR_NOZZLE
variable_brush_x: 130
variable_brush_y: 280
# Z height on the brush for the circles
variable_scrub_z: -0.2
# Nozzle cool enough not to damage the brush
variable_scrub_temp: 150
# Deeper final wipe
variable_wipe_z: -1.5
gcode:
    {% set hotendtemp = params.HOTEND|default(220)|int %}

    # 1. Heat over the chute: residue softens and drips into the chute
    MOVE_TO_TRASH
    M400
    M109 S{hotendtemp}

    # 2. Cool down under the fan to solidify the residue before wiping
    M106 S255
    M104 S{scrub_temp - 10}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp - 30}

    # 3. Wipe on the chute (Qidi pattern)
    M204 S5000
    {% for i in range(5) %}
        G1 X103 F5000
        G1 X90 F5000
    {% endfor %}
    {% for i in range(7) %}
        G1 X114 F5000
        G1 X100 F5000
    {% endfor %}
    {% for i in range(5) %}
        G1 X103 F5000
        G1 X90 F5000
    {% endfor %}
    G1 X125 F15000

    # 4. Lower onto the brush and scrub: circles, zigzag, circles
    G1 X{brush_x} Y{brush_y} F6000
    G1 Z{scrub_z} F600
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={scrub_temp}
    {% for i in range(3) %}
        G2 I0.5 J0.5 F600
    {% endfor %}
    G1 X{brush_x + 10} F200
    G1 Y{brush_y + 1} F200
    G1 X{brush_x} F200
    G1 Y{brush_y + 3} F200
    G1 X{brush_x + 10} F200
    {% for i in range(3) %}
        G2 I0.5 J0.5 F600
    {% endfor %}

    # 5. Quick deeper wipe
    G1 Z0.2
    G1 X180 F12000
    G1 Z{wipe_z}
    {% for i in range(3) %}
        G1 X164 F12000
        G1 X180 F12000
    {% endfor %}
    G1 X164 F12000
    M400
    M118 Nozzle cleared
    G1 Z15 F900
    M106 S0

