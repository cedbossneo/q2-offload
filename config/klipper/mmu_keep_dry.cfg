# Keep the Qidi Box dry. Happy Hare only runs timed drying cycles
# (MMU_HEATER DRY=1); this re-arms a cycle whenever the Box humidity rises.
# Temperature: lowest drying_data entry of the loaded gates, capped by heater_max_temp (65).
#   MMU_KEEP_DRY                  -> status
#   MMU_KEEP_DRY ENABLE=0|1       -> stop / resume the watchdog
#   MMU_KEEP_DRY TRIGGER=35 TARGET=25

[gcode_macro MMU_KEEP_DRY]
description: Re-arm Box drying when humidity rises above TRIGGER, dry down to TARGET
variable_enable: True
variable_trigger: 35        # % RH that starts a drying cycle
variable_target: 25         # % RH that ends it (MMU_HEATER HUMIDITY=)
variable_interval: 900      # s between checks
gcode:
    {% set v = printer["gcode_macro MMU_KEEP_DRY"] %}
    {% if params.ENABLE is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=enable VALUE={params.ENABLE|int != 0}
        {% if params.ENABLE|int == 0 %}
            UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION=0
        {% else %}
            UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION=1
        {% endif %}
    {% endif %}
    {% if params.TRIGGER is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=trigger VALUE={params.TRIGGER|float}
    {% endif %}
    {% if params.TARGET is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=target VALUE={params.TARGET|float}
    {% endif %}
    {% set rh = printer["aht10 unit0_Env"].humidity %}
    {% set drying = "active" in printer.mmu.drying_state %}
    {% set en = params.ENABLE|int if params.ENABLE is defined else v.enable|int %}
    {% set state = "on" if en else "off" %}
    {% set cycle = "running" if drying else "idle" %}
    RESPOND MSG="Keep dry: {state}, humidity {rh}%, start above {params.TRIGGER|default(v.trigger)}%, stop at {params.TARGET|default(v.target)}%, drying cycle {cycle}"

[delayed_gcode _MMU_KEEP_DRY_LOOP]
initial_duration: 120
gcode:
    {% set v = printer["gcode_macro MMU_KEEP_DRY"] %}
    {% set rh = printer["aht10 unit0_Env"].humidity %}
    {% set drying = "active" in printer.mmu.drying_state %}
    {% if v.enable and printer.mmu.enabled and not drying and rh > v.trigger %}
        RESPOND MSG="Keep dry: humidity {rh}% > {v.trigger}%, starting a drying cycle down to {v.target}%"
        MMU_HEATER DRY=1 HUMIDITY={v.target}
    {% endif %}
    {% if v.enable %}
        UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION={v.interval}
    {% endif %}

# Heat the Box while printing, like the stock Qidi firmware: print_temps is Qidi's
# officiall_filas_list box_max_temp (0 = no heating).
# Same materials as Happy Hare drying_data (overrides.cfg), which drying cycles use. With
# several materials loaded the lowest one wins so a PLA spool next to a PETG one does not
# soften. Capped by Happy Hare heater_max_temp. A drying cycle already running is left alone.
#   PRINT_START calls _BOX_PRINT_HEAT, PRINT_END / CANCEL_PRINT call DISABLE_BOX_HEATER.
[gcode_macro _BOX_PRINT_HEAT]
description: Set the Box heater for the materials of this print (stock Qidi behaviour)
variable_enable: True
variable_unit_section: 'mmu_unit_parameters unit0'
variable_print_temps: {
    'PLA': 0, 'PLA+': 0, 'PLA-CF': 0, 'PLA-S': 0, 'PLA-WOOD': 45, 'PETG': 45,
    'PETG-CF': 45, 'PETG-GF': 45, 'TPU': 0, 'TPEE': 0, 'PEBA': 0, 'ASA': 45,
    'ASA-CF': 45, 'ASA-AERO': 45, 'ABS': 55, 'ABS+': 55, 'ABS-GF': 55, 'PC': 0,
    'PC-ABS': 50, 'PC-ABS-FR': 50, 'PET-GF': 50, 'PET-CF': 65, 'PVA': 50, 'HIPS': 0,
    'NYLON': 55, 'PA': 55, 'ULTRAPA': 55, 'PA-CF': 65, 'PA12-CF': 65, 'ULTRAPA-CF25': 65,
    'PA-S': 65, 'PAHT-CF': 65, 'PAHT-GF': 65, 'PAHT-S': 65, 'PPS-CF': 65, 'PPS-GF': 65 }
variable_active: False
gcode:
    {% set v = printer["gcode_macro _BOX_PRINT_HEAT"] %}
    {% set mmu = printer.mmu %}
    {% set slicer = (params.TOOL_MATERIALS | default('')).upper().split(',') %}
    {% set tools = (params.REFERENCED_TOOLS | default('')).split(',') %}
    {% set ns = namespace(materials=[], temp=999, why=[]) %}
    # Every gate holding filament, plus the slicer material of each tool the print uses
    {% for g in range(mmu.gate_status | length) %}
        {% if mmu.gate_status[g] != 0 %}
            {% set ns.materials = ns.materials + [mmu.gate_material[g] | upper | trim] %}
        {% endif %}
    {% endfor %}
    {% for t in tools %}
        {% set i = t | trim | int(-1) %}
        {% if 0 <= i < slicer | length %}
            {% set ns.materials = ns.materials + [slicer[i] | trim] %}
        {% endif %}
    {% endfor %}
    {% for m in ns.materials | unique %}
        {% set base = m.replace('+', '').replace(' ', '-').split('-')[0] %}
        {% set t = v.print_temps.get(m, v.print_temps.get(base, 0)) %}
        {% if m not in v.print_temps and base not in v.print_temps %}
            {% set ns.why = ns.why + [(m or 'unknown') ~ '=0 (not in table)'] %}
        {% else %}
            {% set ns.why = ns.why + [m ~ '=' ~ t] %}
        {% endif %}
        {% set ns.temp = [ns.temp, t] | min %}
    {% endfor %}
    {% set max_temp = printer.configfile.settings.get(v.unit_section, {}).get('heater_max_temp', 65) | float %}
    {% set temp = 0 if ns.temp == 999 else [ns.temp, max_temp] | min %}
    {% if not v.enable %}
        RESPOND MSG="Box print heat: disabled"
    {% elif "active" in mmu.drying_state %}
        RESPOND MSG="Box print heat: drying cycle running, left as is"
    {% elif temp > 0 %}
        RESPOND MSG="Box print heat: {temp|int} C ({ns.why | join(', ')})"
        MMU_HEATER TEMP={temp}
        SET_GCODE_VARIABLE MACRO=_BOX_PRINT_HEAT VARIABLE=active VALUE=True
    {% else %}
        RESPOND MSG="Box print heat: off ({ns.why | join(', ') or 'no material'})"
    {% endif %}

[gcode_macro DISABLE_BOX_HEATER]
description: Stop the Box print heating (a drying cycle keeps running)
gcode:
    {% if printer["gcode_macro _BOX_PRINT_HEAT"].active %}
        SET_GCODE_VARIABLE MACRO=_BOX_PRINT_HEAT VARIABLE=active VALUE=False
        {% if "active" not in printer.mmu.drying_state %}
            MMU_HEATER STOP=1
        {% endif %}
    {% endif %}

# Safety net: the heater regulates on the air sensor, so the heating elements can run
# far hotter than the air. Cut drying if either element sensor exceeds the limit.
[gcode_macro _BOX_HEATER_GUARD_VARS]
variable_max_element_temp: 75
gcode:

[delayed_gcode _BOX_HEATER_GUARD]
initial_duration: 5
gcode:
    {% set lim = printer["gcode_macro _BOX_HEATER_GUARD_VARS"].max_element_temp %}
    {% set ta = printer["temperature_sensor unit0_heater_temp_a"].temperature %}
    {% set tb = printer["temperature_sensor unit0_heater_temp_b"].temperature %}
    {% if printer["heater_generic unit0_heater"].target > 0 and (ta > lim or tb > lim) %}
        RESPOND TYPE=error MSG="Box heater guard: element {ta|round(1)}/{tb|round(1)} C above {lim} C, stopping drying"
        {% if "active" in printer.mmu.drying_state %}
            MMU_HEATER STOP=1
        {% endif %}
        SET_HEATER_TEMPERATURE HEATER=unit0_heater TARGET=0
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_BOX_HEATER_GUARD DURATION=2
