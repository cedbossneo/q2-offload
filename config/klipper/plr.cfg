# ===========================================================================
# Power-loss resume: pieces missing on mainline Klipper/Moonraker.
# plr.sh works with a byte offset (virtual_sdcard.file_position)
# rather than a line number.
# ===========================================================================

[gcode_shell_command PLR_COPY_FILE]
command: @HOME@/printer_data/scripts/plr/plr_copy.sh
timeout: 60
verbose: True

[gcode_shell_command PLR_RECORD]
command: @HOME@/printer_data/scripts/plr/plr_record.sh
timeout: 5
verbose: False

[delayed_gcode PLR_TRACK]
# Re-armed every 60 s while the print runs (60 s is a compromise between
# resume accuracy and micro-pauses caused by spawning a process).
gcode:
    # Keep rescheduling while the job exists, INCLUDING while paused: limiting
    # this to "printing" would stop tracking for good at the first pause and
    # freeze the resume position.
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {% if printer.print_stats.state == "printing" %}
            RUN_SHELL_COMMAND CMD=PLR_RECORD PARAMS="{printer.virtual_sdcard.file_position}"
        {% endif %}
        UPDATE_DELAYED_GCODE ID=PLR_TRACK DURATION=60
    {% endif %}
