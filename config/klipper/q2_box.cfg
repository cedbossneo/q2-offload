# Qidi Box hardware that the Happy Hare "QIDI Box" profile does not generate: slot LEDs,
# drying heater and its fans. Pins and heater PID come from Qidi's stock box1.cfg
# (QIDITECH/QIDI_Q2, GPL-3.0); limits and fan behaviour are q2-offload tuning.

# ---------------------------------------------------------------------------------------
# Slot LEDs (red + white per gate), driven by Happy Hare
# ---------------------------------------------------------------------------------------
[led _qidi_slot_0]
red_pin: unit0:PA2
green_pin: unit0:PA1
initial_red: 0.0
initial_green: 0.0

[led _qidi_slot_1]
red_pin: unit0:PB5
green_pin: unit0:PB4
initial_red: 0.0
initial_green: 0.0

[led _qidi_slot_2]
red_pin: unit0:PA15
green_pin: unit0:PA14
initial_red: 0.0
initial_green: 0.0

[led _qidi_slot_3]
red_pin: unit0:PC5
green_pin: unit0:PC4
initial_red: 0.0
initial_green: 0.0

[mmu_leds unit0]
enabled: True
# Static colours like the stock Box. Every animation frame is an LED command scheduled
# only 100 ms ahead; over the network link a short stall then shuts the Box MCU down
# ("Timer too close"). The lid hides the LEDs anyway.
animation: False
frame_rate: 6
exit_leds:
    led:_qidi_slot_0 (1)
    led:_qidi_slot_1 (1)
    led:_qidi_slot_2 (1)
    led:_qidi_slot_3 (1)
black_light: (1, 0, 0)
white_light: (0, 1, 0)
empty_light: (0, 0, 0)
exit_effect: gate_status
effect_loading: mmu_breathing_white_fast, (0, 1, 0)
effect_loading_extruder: mmu_breathing_white_fast, (0, 1, 0)
effect_unloading: mmu_breathing_white_fast, (0, 1, 0)
effect_unloading_extruder: mmu_breathing_white_fast, (0, 1, 0)
effect_heating: mmu_breathing_red_slow, (1, 0, 0)
effect_selecting: mmu_breathing_white_fast, (0, 1, 0)
effect_checking: mmu_breathing_white_fast, (0, 1, 0)
effect_preloading: mmu_breathing_white_fast, (0, 1, 0)
effect_initialized: mmu_breathing_white_slow, (0, 1, 0)
effect_error: mmu_red_strobe, (1, 0, 0)
effect_complete: mmu_sparkle, (0, 1, 0)
effect_gate_selected: mmu_breathing_white_slow, (0, 1, 0)
effect_gate_available: mmu_static_green, (0, 0.2, 0)
effect_gate_available_sel: mmu_ready_green, (0, 1, 0)
effect_gate_unknown: mmu_breathing_red_slow, (1, 0, 0)
effect_gate_unknown_sel: mmu_breathing_red_slow, (1, 0, 0)
effect_gate_empty: mmu_static_black, (0, 0, 0)
effect_gate_empty_sel: mmu_static_black, (0, 0, 0)
effect_pending_spoolid: mmu_breathing_purple_slow, (1, 0.3, 0)
effect_pending_spoolid_expiring: mmu_red_strobe, (1, 0, 0)

# ---------------------------------------------------------------------------------------
# Drying heater. Regulated on the Box air temperature (AHT20), with the two element
# thermistors watched separately by _BOX_HEATER_GUARD (mmu_keep_dry.cfg).
# ---------------------------------------------------------------------------------------
[heater_generic box1_heater]
heater_pin: unit0:PA3
# Half power: at full power the elements reach ~100 C while the air is still below 50 C,
# enough to deform PETG spool adapters. Stock firmware limits this with a second control
# loop that mainline Klipper does not have.
max_power: 0.5
sensor_type: temperature_combined
sensor_list: temperature_sensor unit0_Env
combination_method: mean
maximum_deviation: 100
min_temp: -100
max_temp: 70
control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125

[verify_heater box1_heater]
max_error: 400
check_gain_time: 600

[temperature_sensor _box1_heater_temp_a]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: unit0:PC1
min_temp: -100
max_temp: 130

[temperature_sensor _box1_heater_temp_b]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: unit0:PC2
min_temp: -100
max_temp: 130

# Fans follow their own temperature. shutdown_speed 0: all three fans starting at 100% on a
# Klipper shutdown or restart browns out the Box USB hub.
[temperature_fan box1_heater_fan_a]
pin: unit0:PA4
sensor_type: temperature_combined
sensor_list: temperature_sensor _box1_heater_temp_a
combination_method: max
maximum_deviation: 100
min_temp: -100
max_temp: 130
target_temp: 35
control: watermark
max_delta: 1
kick_start_time: 0.5
shutdown_speed: 0

[temperature_fan box1_heater_fan_b]
pin: unit0:PA5
sensor_type: temperature_combined
sensor_list: temperature_sensor _box1_heater_temp_b
combination_method: max
maximum_deviation: 100
min_temp: -100
max_temp: 130
target_temp: 35
control: watermark
max_delta: 1
kick_start_time: 0.5
shutdown_speed: 0

[temperature_fan box1_board_fan]
pin: unit0:PA6
sensor_type: temperature_combined
sensor_list: temperature_sensor unit0_mcu
combination_method: max
maximum_deviation: 100
min_temp: -100
max_temp: 130
target_temp: 35
control: watermark
max_delta: 1
kick_start_time: 0.5
shutdown_speed: 0
