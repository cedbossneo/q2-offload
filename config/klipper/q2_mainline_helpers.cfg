# Q2 mainline helpers: native replacements for stock QIDI firmware commands.
# Chute/wipe positions from the BunnyBox community port of the stock flow.

[gcode_macro CLEAR_FLUSH]
description: Stock QIDI Box chute clean-up: slow scrape then flicks over the metal chute adapter
gcode:
    {% if 'xy' not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG='CLEAR_FLUSH: XY not homed - run G28 first'
    {% else %}
        MOVE_TO_TRASH
        M204 S5000
        G1 X100 F200
        G1 X90 F200
        G1 X100 F200
        {% for i in range(5) %}
            G1 X115 F4000
            G1 X98 F8000
        {% endfor %}
        MOVE_TO_TRASH
    {% endif %}

[gcode_macro CLEAR_OOZE]
description: Stock QIDI Box ooze wipe: sweep right along the chute adapter, then back via Y270
gcode:
    {% if 'xy' not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG='CLEAR_OOZE: XY not homed - run G28 first'
    {% else %}
        MOVE_TO_TRASH
        M204 S5000
        G1 X140 F8000
        MOVE_TO_TRASH
    {% endif %}

[gcode_macro REVERSE_HOMING]
description: Stock QIDI reverse Z homing - not available on mainline Klipper
gcode:
    RESPOND TYPE=error MSG='REVERSE_HOMING is a stock-firmware command. Use G28 Z (load cell probe) instead.'

[gcode_macro SAVE_CONFIG_QD]
description: Stock QIDI save-without-restart - not available on mainline Klipper
gcode:
    RESPOND MSG='SAVE_CONFIG_QD: no-op on mainline. Run SAVE_CONFIG manually to persist (will restart Klipper).'
