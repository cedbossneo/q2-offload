# Q2 without a Qidi Box (install.sh --no-box). Included last in printer.cfg in place of the
# Happy Hare / Box includes (commented "#no-box#"). Stands in for the Box commands that
# PRINT_START, PRINT_END, the cancel and idle macros and the Orca profile send, so the same
# macros and slicer profile work with the filament loaded straight into the toolhead.

# ---------------------------------------------------------------------------------------
# Happy Hare print start/end, called by PRINT_START and the Orca end G-code
# ---------------------------------------------------------------------------------------
[gcode_macro MMU_START_SETUP]
description: No Qidi Box: nothing to set up
gcode:

[gcode_macro MMU_START_CHECK]
description: No Qidi Box: nothing to check
gcode:

[gcode_macro MMU_END]
description: No Qidi Box: nothing to do
gcode:

[gcode_macro MMU_START_LOAD_INITIAL_TOOL]
description: No Qidi Box: the filament is already in the toolhead, prime it over the chute
variable_prime_length: 25
gcode:
    {% set length = printer["gcode_macro MMU_START_LOAD_INITIAL_TOOL"].prime_length %}
    {% set accel = printer.toolhead.max_accel %}
    SAVE_GCODE_STATE NAME=_nobox_prime
    MOVE_TO_TRASH
    M83
    G1 E{length} F300
    G1 E-1 F1800
    M400
    M106 S255
    G4 P3000
    CLEAR_OOZE
    CLEAR_FLUSH
    M106 S0
    RESTORE_GCODE_STATE NAME=_nobox_prime
    # MOVE_TO_TRASH and the wipes set their own acceleration
    SET_VELOCITY_LIMIT ACCEL={accel}

# ---------------------------------------------------------------------------------------
# Box material profile and heater (gcode_macro_mmu.cfg, mmu_keep_dry.cfg with a Box)
# ---------------------------------------------------------------------------------------
[gcode_macro _MMU_FLEX_PROFILE]
gcode:

[gcode_macro _BOX_PRINT_HEAT]
gcode:

[gcode_macro DISABLE_BOX_HEATER]
description: No Qidi Box: no Box heater to turn off
gcode:

# ---------------------------------------------------------------------------------------
# Tool changes: Orca sends T[next_extruder]. Only T0 exists without a Box.
# ---------------------------------------------------------------------------------------
[gcode_macro T0]
description: Single filament (no Qidi Box): nothing to change
gcode:

[gcode_macro T1]
gcode:
    {action_raise_error("T1: this printer has no Qidi Box, only one filament (T0). Slice with a single filament.")}

[gcode_macro T2]
gcode:
    {action_raise_error("T2: this printer has no Qidi Box, only one filament (T0). Slice with a single filament.")}

[gcode_macro T3]
gcode:
    {action_raise_error("T3: this printer has no Qidi Box, only one filament (T0). Slice with a single filament.")}

# ---------------------------------------------------------------------------------------
# Filament runout: the toolhead filament sensor. With a Box, Happy Hare owns this pin as
# its extruder sensor (config/happy-hare/mmu_config), so it is only declared here.
# Klipper acts on it only while printing: a runout pauses the print (Mainsail PAUSE, park),
# and RESUME refuses to continue until filament is detected again.
# ---------------------------------------------------------------------------------------
[filament_switch_sensor filament_sensor]
switch_pin: !THR:PA1
pause_on_runout: True
runout_gcode:
    M118 Filament runout: print paused. Load filament (LOAD_FILAMENT), then RESUME.
    BEEP I=3 DUR=500
event_delay: 3.0
pause_delay: 0.5

# PRINT_START turns it off while it homes, wipes and primes, and back on when the print
# starts; PRINT_END, cancel and the load/unload macros turn it off.
[gcode_macro ENABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

[gcode_macro DISABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

# Mainsail's RESUME checks this sensor (no filament: resume refused)
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: "filament_switch_sensor filament_sensor"

# Keep the sensor on while paused, unlike with a Box (Happy Hare needs it off): RESUME can
# then check that filament was loaded, and the print goes on with runout detection
[gcode_macro _USER_PAUSE_EXTRA]
description: Extra actions run after PAUSE_BASE (no Qidi Box: none)
gcode:

# LOAD_FILAMENT / UNLOAD_FILAMENT during the pause turn the sensor off: back on for the
# rest of the print (RESUME only gets here once its own checks passed)
[gcode_macro _USER_RESUME_EXTRA]
description: Extra actions run before RESUME_BASE (no Qidi Box: runout sensor back on)
gcode:
    ENABLE_ALL_SENSOR
