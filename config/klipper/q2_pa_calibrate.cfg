# Pressure advance calibration of a spool created from an NFC tag (q2-offload).
#
# A scanned tag that creates a Spoolman spool makes Happy Hare call _MMU_EVENT
# EVENT=spool_created (patch 0006), extended here by _SPOOL_PA_MMU_EVENT. If the spool's filament
# has no pressure advance yet, the q2_calibration Moonraker component reads the temperature
# and flow ratio the slicer prints it with and calls _SPOOL_PA_OFFER, which asks: calibrate now,
# at the next print that uses the spool, or skip. The measurement is autopa's load-cell sweep
# (AUTOPA_SWEEP), in the air over the chute; a valid value is saved on the filament in
# Spoolman, so the next spool of the same filament and the OrcaSlicer presets use it.
#
# SPOOL_PA_CALIBRATE SPOOL=<id> runs a pending calibration by hand (also after a failed one).
#
# Each step shows in a dialog and on the status line (HelixScreen, Mainsail, Fluidd); the nozzle
# is wiped on the brush at the end, and the result (saved value or failure) stays in a dialog
# until OK, with a HelixScreen notification.

[gcode_macro _SPOOL_PA_VARS]
# Set by the q2_calibration Moonraker component when it is loaded (needs Spoolman)
variable_enabled: False
# Pressure advance range swept per material: start, end, step. A result on an edge of the
# range is not saved (the true value may be outside it).
variable_ranges: {
    'PLA': (0.01, 0.08, 0.01), 'PLA+': (0.01, 0.08, 0.01),
    'PETG': (0.02, 0.12, 0.01), 'ABS': (0.01, 0.10, 0.01), 'ASA': (0.01, 0.10, 0.01),
    'PC': (0.01, 0.10, 0.01), 'PA': (0.01, 0.10, 0.01), 'TPU': (0.04, 0.30, 0.02) }
variable_default_range: (0.01, 0.10, 0.01)
gcode:

[gcode_macro _SPOOL_PA_MMU_EVENT]
description: Happy Hare event extension: offers a pressure advance calibration for a spool created from a tag
gcode:
    {% if params.EVENT == "spool_created" and printer["gcode_macro _SPOOL_PA_VARS"].enabled
          and params.SPOOLID|default(0)|int > 0 %}
        {action_call_remote_method("q2_pa_spool_created", spool_id=params.SPOOLID|int,
                                   gate=params.GATE|default(-1)|int)}
    {% endif %}

[gcode_macro _SPOOL_PA_PENDING_SET]
description: Adds a spool to the pending pressure advance calibrations (FILAMENT= TEMP= FLOW= MATERIAL= NAME= TRIES=), or removes it (SPOOL= only) and, with DROP_FILAMENT=<id>, every other spool of that filament
gcode:
    {% set pending = printer.save_variables.variables.q2_pa_pending|default({}) %}
    {% set spool = params.SPOOL|int %}
    {% set drop = params.DROP_FILAMENT|default(-1)|int %}
    {% set kept = {} %}
    {% for id, entry in pending.items() if id|int != spool and entry.filament|default(-1) != drop %}
        {% set _ = kept.update({id|int: entry}) %}
    {% endfor %}
    {% if params.TEMP is defined %}
        {% set _ = kept.update({spool: {'filament': params.FILAMENT|default(-1)|int, 'temp': params.TEMP|int,
                                        'flow': params.FLOW|float, 'material': params.MATERIAL|default(""),
                                        'name': params.NAME|default(""), 'tries': params.TRIES|default(0)|int}}) %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=q2_pa_pending VALUE="{kept}"

[gcode_macro _SPOOL_PA_OFFER]
description: Called by the q2_calibration Moonraker component for a new spool without pressure advance
gcode:
    {% set spool = params.SPOOL|int %}
    {% set name = params.NAME|default("spool %d" % spool) %}
    {% set temp = params.TEMP|int %}
    _SPOOL_PA_PENDING_SET SPOOL={spool} FILAMENT={params.FILAMENT|default(-1)|int} TEMP={temp} FLOW={params.FLOW|float} MATERIAL="{params.MATERIAL|default('')}" NAME="{name}"
    {% set busy = printer.print_stats.state in ("printing", "paused") %}
    RESPOND TYPE=command MSG="action:prompt_begin New spool: {name}"
    RESPOND TYPE=command MSG="action:prompt_text Measure its pressure advance with the load cell? About 3 minutes at {temp} C, in the air over the chute. The value is saved in Spoolman for this filament."
    {% if not busy %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Calibrate now|SPOOL_PA_CALIBRATE SPOOL={spool}|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button At next print|_SPOOL_PA_LATER SPOOL={spool}|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Skip|_SPOOL_PA_SKIP SPOOL={spool}|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SPOOL_PA_LATER]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND PREFIX=q2 MSG="Spool {params.SPOOL}: pressure advance will be measured at the start of the next print that uses it"

[gcode_macro _SPOOL_PA_SKIP]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _SPOOL_PA_PENDING_SET SPOOL={params.SPOOL|int}
    RESPOND PREFIX=q2 MSG="Spool {params.SPOOL}: no pressure advance calibration"

[gcode_macro SPOOL_PA_CALIBRATE]
description: Measure the pressure advance of a spool waiting for it (SPOOL=<Spoolman id>) with the load cell
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set spool = params.SPOOL|default(0)|int %}
    {% set pending = printer.save_variables.variables.q2_pa_pending|default({}) %}
    {% set entry = pending[spool]|default(none) %}
    {% set gates = printer.mmu.gate_spool_id if printer.mmu is defined else [] %}
    {% if printer.print_stats.state in ("printing", "paused") and params.PRINT|default(0)|int == 0 %}
        RESPOND TYPE=error MSG="SPOOL_PA_CALIBRATE: not during a print"
    {% elif entry is none %}
        RESPOND TYPE=error MSG="SPOOL_PA_CALIBRATE: spool {spool} is not waiting for a calibration (waiting: {pending.keys()|list})"
    {% elif spool not in gates %}
        RESPOND TYPE=error MSG="SPOOL_PA_CALIBRATE: spool {spool} is not in a Box slot"
    {% else %}
        {% set vars = printer["gcode_macro _SPOOL_PA_VARS"] %}
        {% set range = vars.ranges[entry.material|upper]|default(vars.default_range) %}
        _SPOOL_PA_RUN SPOOL={spool} GATE={gates.index(spool)} TEMP={entry.temp} FLOW={entry.flow} KSTART={range[0]} KEND={range[1]} KSTEP={range[2]} APPLY={params.APPLY|default(0)} PRINT={params.PRINT|default(0)}
    {% endif %}

[gcode_macro _SPOOL_PA_RUN]
description: Load the gate, heat to the spool's temperature and run autopa's sweep at its flow ratio
gcode:
    {% set spool = params.SPOOL|int %}
    {% set gate = params.GATE|int %}
    {% set temp = params.TEMP|int %}
    RESPOND PREFIX=q2 MSG="Spool {spool} (gate {gate}): pressure advance calibration at {temp} C, flow ratio {params.FLOW}"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SPOOL_PA_STATUS SPOOL={spool} STEP="Homing"
        G28
    {% endif %}
    M104 S{temp}
    {% if printer.mmu.gate != gate or printer.mmu.filament != "Loaded" %}
        _SPOOL_PA_STATUS SPOOL={spool} STEP="Loading slot {gate + 1}"
        {% if printer.mmu.filament != "Unloaded" %}
            MMU_UNLOAD
        {% endif %}
        MMU_SELECT GATE={gate}
        MMU_LOAD
    {% endif %}
    MOVE_TO_TRASH
    _SPOOL_PA_STATUS SPOOL={spool} STEP="Heating the nozzle to {temp} C"
    M109 S{temp}
    _SPOOL_PA_STATUS SPOOL={spool} STEP="Measuring with the load cell, about 3 minutes"
    # The flow ratio scales the sweep's extrusion like the slicer's (autopa moves with G1).
    # A failed sweep stops this macro before M221 S100: PRINT_START resets it (gcode_macro_mmu.cfg)
    M221 S{(params.FLOW|float * 100)|round(1)}
    AUTOPA_SWEEP APPLY=0 KSTART={params.KSTART} KEND={params.KEND} KSTEP={params.KSTEP}
    M221 S100
    _SPOOL_PA_STATUS SPOOL={spool} STEP="Wiping the nozzle"
    _SPOOL_PA_WIPE TEMP={temp}
    {% if not params.PRINT|default(0)|int %}
        M104 S0
    {% endif %}
    _SPOOL_PA_RESULT SPOOL={spool} KSTART={params.KSTART} KEND={params.KEND} KSTEP={params.KSTEP} APPLY={params.APPLY|default(0)}

[gcode_macro _SPOOL_PA_WIPE]
description: NOZZLE_WIPE without the bed mesh, which would shift its depth on the brush, then the mesh back
gcode:
    {% set mesh = printer.bed_mesh.profile_name|default("") %}
    # A saved profile (PRINT_START saves its mesh as ADAPTIVE) is reloaded by name; any other
    # mesh goes through a temporary profile
    {% set saved = mesh in printer.bed_mesh.profiles|default({}) %}
    {% if mesh %}
        {% if not saved %}
            BED_MESH_PROFILE SAVE=_SPOOL_PA_KEEP
        {% endif %}
        BED_MESH_CLEAR
    {% endif %}
    NOZZLE_WIPE HOTEND={params.TEMP|int}
    {% if mesh and saved %}
        BED_MESH_PROFILE LOAD="{mesh}"
    {% elif mesh %}
        BED_MESH_PROFILE LOAD=_SPOOL_PA_KEEP
        BED_MESH_PROFILE REMOVE=_SPOOL_PA_KEEP
    {% endif %}

[gcode_macro _SPOOL_PA_STATUS]
description: Shows a calibration step in a dialog and on the status line
gcode:
    {% set entry = printer.save_variables.variables.q2_pa_pending|default({}) %}
    {% set name = (entry[params.SPOOL|int]|default({})).name|default("spool " ~ params.SPOOL) %}
    M117 Pressure advance: {params.STEP}
    RESPOND TYPE=command MSG="action:prompt_begin Pressure advance: {name}"
    RESPOND TYPE=command MSG="action:prompt_text {params.STEP}..."
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SPOOL_PA_NOTICE]
description: The result of a calibration: a dialog until OK, a HelixScreen notification and the status line
gcode:
    M117 {params.MSG}
    RESPOND TYPE=command MSG="action:notify {params.MSG}"
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE}"
    RESPOND TYPE=command MSG="action:prompt_text {params.MSG}"
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|_SPOOL_PA_CLOSE|{'error' if params.ERROR|default(0)|int else 'primary'}"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SPOOL_PA_CLOSE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M117

[gcode_macro _SPOOL_PA_RESULT]
description: Save a valid sweep result in Spoolman (q2_calibration component), or keep the spool pending
gcode:
    {% set spool = params.SPOOL|int %}
    {% set kstart = params.KSTART|float %}
    {% set kend = params.KEND|float %}
    {% set edge = params.KSTEP|float / 2 %}
    {% set sweep = (printer.autopa.last|default({})).sweep|default({}) %}
    {% set k = sweep.k_opt|default(none) %}
    {% set entry = printer.save_variables.variables.q2_pa_pending|default({}) %}
    {% set entry = entry[spool]|default(none) %}
    {% if k is not none and kstart + edge < k < kend - edge %}
        # The q2_calibration component replaces this with the saved value (_SPOOL_PA_NOTICE)
        _SPOOL_PA_STATUS SPOOL={spool} STEP="Pressure advance {'%.4f' % k}, saving in Spoolman"
        {action_call_remote_method("q2_pa_store", spool_id=spool, pa=k)}
        # The value is the filament's: other spools of it waiting are done too
        _SPOOL_PA_PENDING_SET SPOOL={spool} DROP_FILAMENT={entry.filament|default(-1) if entry is not none else -1}
        {% if params.APPLY|default(0)|int %}
            SET_PRESSURE_ADVANCE ADVANCE={k}
        {% endif %}
        RESPOND PREFIX=q2 MSG="Spool {spool}: pressure advance {'%.4f' % k}"
    {% else %}
        {% if entry is not none %}
            _SPOOL_PA_PENDING_SET SPOOL={spool} FILAMENT={entry.filament|default(-1)} TEMP={entry.temp} FLOW={entry.flow} MATERIAL="{entry.material}" NAME="{entry.name}" TRIES={entry.tries|default(0) + 1}
        {% endif %}
        RESPOND TYPE=error MSG="Spool {spool}: no valid pressure advance (result {k} for the range {kstart}-{kend}), nothing saved. Retry with SPOOL_PA_CALIBRATE SPOOL={spool}"
        _SPOOL_PA_NOTICE ERROR=1 TITLE="Pressure advance not saved" MSG="{entry.name if entry is not none else 'Spool %d' % spool}: no valid value (result {k} for the range {kstart} to {kend}). Retry with SPOOL_PA_CALIBRATE SPOOL={spool}"
    {% endif %}

[gcode_macro _SPOOL_PA_PRINT_START]
description: From PRINT_START: calibrate the pending spools this print uses (first attempt only), then back to the print temperature
gcode:
    {% set pending = printer.save_variables.variables.q2_pa_pending|default({}) %}
    {% set tools = params.REFERENCED_TOOLS|default("")|string %}
    {% set tools = tools.split(",")|map("trim")|select|map("int")|list %}
    {% set ttg = printer.mmu.ttg_map if printer.mmu is defined else [] %}
    {% set used = [] %}
    {% for t in tools if t < ttg|length %}
        {% set _ = used.append(printer.mmu.gate_spool_id[ttg[t]]) %}
    {% endfor %}
    {% set todo = [] %}
    {% for id, entry in pending.items() if id|int in used and entry.tries|default(0) == 0 %}
        {% set _ = todo.append(id|int) %}
    {% endfor %}
    {% if printer["gcode_macro _SPOOL_PA_VARS"].enabled and todo %}
        {% for spool in todo %}
            SPOOL_PA_CALIBRATE SPOOL={spool} PRINT=1 APPLY={1 if used|length == 1 else 0}
        {% endfor %}
        MOVE_TO_TRASH
        M109 S{params.HOTEND|int}
    {% endif %}
