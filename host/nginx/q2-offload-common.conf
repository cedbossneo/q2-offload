# Shared by the Fluidd and Mainsail servers (q2-offload)
location /websocket {
    proxy_pass http://q2_offload_moonraker/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $q2_offload_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Api-Key $q2_offload_api_key;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
}

location ~ ^/(printer|api|access|machine|server)/ {
    proxy_pass http://q2_offload_moonraker$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Api-Key $q2_offload_api_key;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;
}

# Printer camera (stock mjpg-streamer behind the printer's nginx), relayed so browsers
# that cannot reach the printer's address still see it. No buffering: MJPEG is a stream.
location /webcam/ {
    proxy_pass http://@PRINTER_IP@/webcam/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Box drying page (web/box)
location = /box {
    return 301 /box/;
}
location /box/ {
    alias @HOME@/printer_data/web/box/;
    add_header Cache-Control "no-cache";
}

# Failure detection page (web/detect) and its service (q2-detect, live updates over SSE)
location = /detect {
    return 301 /detect/;
}
location /detect/api/ {
    proxy_pass http://127.0.0.1:7130/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 64k;
}
location /detect/ {
    alias @HOME@/printer_data/web/detect/;
    add_header Cache-Control "no-cache";
}
# Filament presets generated from Spoolman, downloaded by the OrcaSlicer plugin
location /q2-spools/ {
    alias @HOME@/printer_data/web/spools/;
    add_header Cache-Control "no-cache";
}

# Styles and scripts shared by the q2-offload pages (web/assets)
location /q2-assets/ {
    alias @HOME@/printer_data/web/assets/;
    add_header Cache-Control "no-cache";
}

# Spoolman runs on its own port (Docker, :7912): send the browser there on the same host
# name it used for this page, so the sidebar link works from any address of the host
location = /spoolman {
    return 302 $scheme://$host:7912/;
}

location = /autopa {
    return 301 /autopa/;
}
location /autopa/captures/ {
    alias @HOME@/printer_data/autopa/captures/;
}
location /autopa/ {
    alias @HOME@/autopa/web/dist/;
    try_files $uri $uri/ /autopa/index.html;
}
