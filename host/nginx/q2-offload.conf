# q2-offload: Mainsail on :@MAINSAIL_PORT@, Fluidd on :@FLUIDD_PORT@, the Box page under /box/
# and autopa under /autopa/ on both.
# Generated by install.sh -- local edits are overwritten on update. install.sh keeps the
# servers of the installed clients and makes the one on :80 the default server.
# Names are prefixed: KIAUH installs of Mainsail/Fluidd leave conf.d/upstreams.conf
# (upstream apiserver) and conf.d/common_vars.conf ($connection_upgrade) behind.

map $http_upgrade $q2_offload_connection_upgrade {
    default upgrade;
    '' close;
}

upstream q2_offload_moonraker {
    ip_hash;
    server 127.0.0.1:7125;
}

server {
    listen @FLUIDD_PORT@;
    root @HOME@/fluidd;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    include /etc/nginx/q2-offload-common.conf;
}

server {
    listen @MAINSAIL_PORT@;
    root @HOME@/mainsail;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    include /etc/nginx/q2-offload-common.conf;
}
