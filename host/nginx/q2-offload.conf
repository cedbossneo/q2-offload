# q2-offload: Fluidd on :80, Mainsail on :81, autopa under /autopa/ on both.
# Generated by install.sh -- local edits are overwritten on update.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream apiserver {
    ip_hash;
    server 127.0.0.1:7125;
}

server {
    listen @FLUIDD_PORT@ default_server;
    root @HOME@/fluidd;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    include /etc/nginx/q2-offload-common.conf;
}

server {
    listen @MAINSAIL_PORT@;
    root @HOME@/mainsail;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    include /etc/nginx/q2-offload-common.conf;
}
